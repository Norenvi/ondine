name: OCI A1.Flex capacity retry

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

env:
  COMPARTMENT_ID: "ocid1.tenancy.oc1..aaaaaaaawz727nwg5tszpmd4vevk35gqpgodzgxrhyzffbbzjqkroenoy2za"
  AVAILABILITY_DOMAIN: "sWGg:EU-MARSEILLE-1-AD-1"
  SUBNET_ID: "ocid1.subnet.oc1.eu-marseille-1.aaaaaaaas5qipov57jo5dqdsqjaoq2v6gd5etdjpw2nfij2lush6vosbgupq"
  IMAGE_ID: "ocid1.image.oc1.eu-marseille-1.aaaaaaaasa2lx4x7hulez5m7ez6etz5kopebfcll4nb63sfnpxyqnwzdzd6a"
  DISPLAY_NAME: "ondine-vm"
  OCPUS: "2"
  MEMORY_GB: "12"
  SSH_PUBLIC_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBOIwFx3s878kC7iRzsIg0Gj/ZEwp3keP48qmjJLGg9X antoine@LAPTOP-FD153M77"

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: pip install oci-cli

      - name: Configure OCI credentials
        run: |
          mkdir -p ~/.oci
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          key_file=~/.oci/oci_api_key.pem
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          pass_phrase=${{ secrets.OCI_PASSPHRASE }}
          EOF
          chmod 600 ~/.oci/config

      - name: Skip if instance already exists
        id: check
        run: |
          existing=$(oci compute instance list \
            --compartment-id "$COMPARTMENT_ID" \
            --display-name "$DISPLAY_NAME" \
            --lifecycle-state RUNNING \
            --query 'data[0].id' --raw-output 2>/dev/null || true)
          if [[ -n "$existing" && "$existing" != "null" ]]; then
            echo "Instance already exists: $existing, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attempt launch
        if: steps.check.outputs.skip == 'false'
        run: |
          set +e
          result=$(oci compute instance launch \
            --compartment-id "$COMPARTMENT_ID" \
            --availability-domain "$AVAILABILITY_DOMAIN" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config "{\"ocpus\": $OCPUS, \"memoryInGBs\": $MEMORY_GB}" \
            --image-id "$IMAGE_ID" \
            --subnet-id "$SUBNET_ID" \
            --assign-public-ip true \
            --display-name "$DISPLAY_NAME" \
            --ssh-authorized-keys-string "$SSH_PUBLIC_KEY" \
            --wait-for-state RUNNING \
            --max-wait-seconds 240 \
            2>&1)
          code=$?
          echo "$result"
          if [[ $code -eq 0 ]]; then
            echo "### Instance launched successfully" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$result" | grep -E '"id"|"lifecycle-state"' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          elif echo "$result" | grep -qi "Out of.*capacity\|OutOfHostCapacity\|TooManyRequests\|status\": 429"; then
            echo "No capacity yet (or rate limited), will retry on next scheduled run."
            exit 0
          else
            echo "Unexpected error:"
            echo "$result"
            exit 1
          fi
