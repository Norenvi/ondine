services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ondine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, see .env.example}
      POSTGRES_DB: ondine
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ondine"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://ondine:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, see .env.example}@db:5432/ondine
    ports:
      # Exposed on the host so `npm run dev` (Vite's own server, outside docker) can
      # reach it directly, mirroring what Caddy proxies to in the full compose stack.
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    environment:
      DATABASE_URL: postgresql://ondine:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, see .env.example}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET in .env, see .env.example}
    ports:
      # Not in the OCI security list (like db/backend below), so unreachable from the
      # public internet even on the VM. Admin dashboard : SSH tunnel like Postgres
      # (see "Seeder la base Postgres de la VM" in CLAUDE.md), just port 3001 instead of 5432.
      # Host port 3001, not 3000 : WSL2's localhost-forwarding relay got stuck for 3000
      # specifically on this machine (confirmed working container, refused from Windows).
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    build:
      context: ./frontend
      args:
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - backend
      - umami
    restart: unless-stopped

  # Pipeline : pas un service permanent, lancer a la demande, ex:
  #   docker compose --profile tools run --rm pipeline src/download.py
  # Contexte de build = racine du repo (pas ./pipeline) : seed_db.py importe les modeles
  # ORM depuis backend/src, l'image a donc besoin des deux dossiers cote a cote.
  pipeline:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://ondine:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, see .env.example}@db:5432/ondine
    volumes:
      - ./pipeline:/repo/pipeline
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  db-data:
  caddy-data:
